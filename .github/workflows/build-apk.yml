name: Build Nexusia APK (WebView)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android-src/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Setup Android project
        run: |
          mkdir -p app/src/main/java/com/r3dm/nexusia
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          cp android-src/AndroidManifest.xml app/src/main/
          cp android-src/MainActivity.java app/src/main/java/com/r3dm/nexusia/
          cp android-src/styles.xml app/src/main/res/values/
          cp android-src/settings.gradle settings.gradle
          cp android-src/build.gradle.root build.gradle
          cp android-src/build.gradle.app app/build.gradle
          cp android-src/gradle.properties gradle.properties

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexusia-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%Y%m%d%H%M)"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk             --title "Nexusia $TAG"             --notes "APK WebView: panel de ingresos pasivos con IA"
